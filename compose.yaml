services:
  # --- AUTH DATABASE ---
  postgres-auth:
    image: postgres:16.4-alpine3.20
    container_name: eduquiz-postgres-auth
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: eduquiz_auth_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - eduquiz_network

  # --- QUIZ DATABASE ---
  postgres-quiz:
    image: postgres:16.4-alpine3.20
    container_name: eduquiz-postgres-quiz
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: eduquiz_quiz_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_quiz_data:/var/lib/postgresql/data
    networks:
      - eduquiz_network

volumes:
  postgres_auth_data:
  postgres_quiz_data:

networks:
  eduquiz_network:
    driver: bridge
