services:
  backend:
    build:
      context: ./
      dockerfile: EduQuiz.API/Dockerfile
      target: final

    ports:
      - "8080:8080"
    container_name: eduquiz-backend
    networks:
      - eduquiz_network
    depends_on:
      - postgres
  
  postgres:
    image: postgres:16.4-alpine3.20
    container_name: eduquiz-postgres
    #Test credentials
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: eduquizdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eduquiz_network

volumes:
  postgres_data:

networks:
  eduquiz_network:
    driver: bridge