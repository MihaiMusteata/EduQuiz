services:
  api_gateway:
    build:
      context: ./APIGateway
      dockerfile: Dockerfile
    ports:
      - "3030:8080"
    container_name: api-gateway
    depends_on:
      - authentication_service
      - quiz_service
      - quiz_session_service
      - ai_service
    networks:
      - eduquiz_network

  authentication_service:
    build:
      context: .
      dockerfile: Authentication/Authentication.API/Dockerfile
    ports:
      - "8081:8080"
    container_name: auth-service
    depends_on:
      - postgres-auth
    networks:
      - eduquiz_network

  quiz_service:
    build:
      context: .
      dockerfile: Quiz/Quiz.API/Dockerfile
    ports:
      - "8082:8080"
    container_name: quiz-service
    depends_on:
      - postgres-quiz
    environment:
      - ConnectionStrings__DefaultConnection=Host=host.docker.internal;Port=5433;Database=eduquiz_quiz_db;Username=admin;Password=secret
    networks:
      - eduquiz_network

  quiz_session_service:
    build:
      context: .
      dockerfile: QuizSession/QuizSession.API/Dockerfile
    ports:
      - "8083:8080"
    container_name: quiz-session-service
    depends_on:
      - postgres-quiz-session
    networks:
      - eduquiz_network
  
  ai_service:
    build:
      context: ./AI
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    container_name: ai_service
    env_file:
      - ./AI/.env
    networks:
      - eduquiz_network

  # --- AUTH DATABASE ---
  postgres-auth:
    image: postgres:16.4-alpine3.20
    container_name: eduquiz-postgres-auth
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: eduquiz_auth_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - eduquiz_network

  # --- QUIZ DATABASE ---
  postgres-quiz:
    image: postgres:16.4-alpine3.20
    container_name: eduquiz-postgres-quiz
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: eduquiz_quiz_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_quiz_data:/var/lib/postgresql/data
    networks:
      - eduquiz_network

  # --- QUIZ SESSION DATABASE ---
  postgres-quiz-session:
    image: postgres:16.4-alpine3.20
    container_name: eduquiz-postgres-quiz-session
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: eduquiz_quiz_session_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_quiz_session_data:/var/lib/postgresql/data
    networks:
      - eduquiz_network

volumes:
  postgres_auth_data:
  postgres_quiz_data:
  postgres_quiz_session_data:

networks:
  eduquiz_network:
    driver: bridge