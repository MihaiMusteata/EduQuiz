services:
  
  
  ai_service:
    build:
      context: ./AI
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8001:8001"
    container_name: ai_service
    env_file:
      - ./AI/.env
    networks:
      - eduquiz_network

  # --- AUTH DATABASE ---
  postgres-auth:
    image: postgres:16.4-alpine3.20
    container_name: eduquiz-postgres-auth
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: eduquiz_auth_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - eduquiz_network

  # --- QUIZ DATABASE ---
  postgres-quiz:
    image: postgres:16.4-alpine3.20
    container_name: eduquiz-postgres-quiz
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: eduquiz_quiz_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_quiz_data:/var/lib/postgresql/data
    networks:
      - eduquiz_network

  # --- QUIZ SESSION DATABASE ---
  postgres-quiz-session:
    image: postgres:16.4-alpine3.20
    container_name: eduquiz-postgres-quiz-session
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: eduquiz_quiz_session_db
    ports:
      - "5435:5432"

volumes:
  postgres_auth_data:
  postgres_quiz_data:

networks:
  eduquiz_network:
    driver: bridge
